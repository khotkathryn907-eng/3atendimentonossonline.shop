<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultar Descontos Disponíveis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)),
url("https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.card{

width:100%;
max-width:540px;

background:#fff;

border-radius:35px;

padding:45px 30px;

text-align:center;

box-shadow:0 15px 50px rgba(0,0,0,.18);

animation:fade .8s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

width:70px;
height:70px;

margin:auto;
margin-bottom:25px;

background:#d91d76;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:34px;
color:#fff;
font-weight:bold;

}

h1{

font-size:42px;

line-height:1.2;

color:#b3005b;

font-weight:700;

margin-bottom:30px;

}

p{

font-size:28px;

color:#8d2460;

margin-bottom:40px;

}

.botao{

display:block;

width:100%;

background:#d91d76;

padding:22px;

border-radius:22px;

text-decoration:none;

color:#fff;

font-size:32px;

font-weight:700;

transition:.3s;

}

.botao:hover{

background:#bf005f;

transform:translateY(-2px);

box-shadow:0 12px 25px rgba(217,29,118,.35);

}

.rodape{

margin-top:30px;

font-size:14px;

color:#999;

line-height:1.6;

}

@media(max-width:600px){

.card{

padding:35px 20px;

}

h1{

font-size:31px;

}

p{

font-size:22px;

}

.botao{

font-size:26px;

padding:18px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
$
</div>

<h1>
Confira se há<br>
descontos liberados<br>
no seu nome
</h1>

<p>
Verifique em segundos
</p>

<a
href="https://polite-desenrola.netlify.app/"
class="botao"
target="_blank"
rel="noopener noreferrer">
Consultar agora
</a>

<div class="rodape">

Consulta rápida e segura.<br>
Clique no botão acima para verificar possíveis descontos disponíveis.

</div>

</div>

</body>
</html>
